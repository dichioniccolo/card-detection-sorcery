name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="main-$(git rev-parse --short HEAD)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=CardsDetectionSorcery-$version.exe" >> "$GITHUB_OUTPUT"

      # La versione finisce dentro l'eseguibile: e' quella che l'applicazione
      # confronta con l'ultima release per sapere se deve aggiornarsi.
      - name: Stamp version
        shell: bash
        run: |
          printf 'APP_VERSION = "%s"\n' "${{ steps.version.outputs.version }}" > src/version_stamp.py
          cat src/version_stamp.py
          mv src/version_stamp.py src/version.py

      - name: Build
        run: pyinstaller --clean --noconfirm CardsDetectionSorcery.spec

      - name: Rename executable
        shell: bash
        run: mv dist/CardsDetectionSorcery.exe "dist/${{ steps.version.outputs.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: dist/${{ steps.version.outputs.artifact }}
          retention-days: 30

      # Ogni push su main aggiorna una prerelease mobile "latest".
      # Nome fisso: altrimenti la release "latest" accumula un file per commit.
      - name: Prepare rolling asset
        if: startsWith(github.ref, 'refs/tags/') == false
        shell: bash
        run: cp "dist/${{ steps.version.outputs.artifact }}" dist/CardsDetectionSorcery-latest.exe

      - name: Publish rolling development release
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Ultima build di sviluppo
          body: Build automatica dal commit ${{ github.sha }}.
          prerelease: true
          files: dist/CardsDetectionSorcery-latest.exe

      # Su tag v* pubblica la release definitiva, con il file nominato per versione.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: dist/${{ steps.version.outputs.artifact }}
